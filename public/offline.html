<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071A2D">
<meta name="robots" content="noindex">
<title>BATBOT — Connexion indisponible</title>
<style>
:root{color-scheme:dark;--bg:#071A2D;--card:#102B4C;--blue:#00BFFF;--green:#21C55D;--muted:#AFC1D4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#12385C,var(--bg) 70%);font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center}
main{width:min(100%,420px);padding:30px 22px;border:1px solid #23486B;border-radius:22px;background:rgba(16,43,76,.96);box-shadow:0 12px 36px #0005}
img{width:100px;height:100px;object-fit:contain;background:#fff;border:2px solid var(--green);border-radius:50%;padding:5px}
h1{font-size:25px;margin:22px 0 10px}
p{font-size:16px;line-height:1.6;color:var(--muted)}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--green);color:#062018;font-size:16px;font-weight:700}
small{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
<main>
<img src="/icon-192.png" alt="Logo BATBOT">
<h1>Connexion Internet indisponible</h1>
<p>BATBOT ne peut pas se connecter pour le moment. Vérifiez votre connexion Internet, puis réessayez.</p>
<button type="button" onclick="window.location.reload()">Réessayer</button>
<small>Vos données ne sont pas supprimées. Cette page est uniquement un écran de secours.</small>
</main>
</body>
</html>
